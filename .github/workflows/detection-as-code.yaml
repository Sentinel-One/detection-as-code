---
name: Detection as Code

on:
  push:
    branches:
      - main
    paths:
      - 'detections/**'
      - 'consoles/**'
  pull_request:
    paths:
      - 'detections/**'
      - 'consoles/**'

# Least-privilege default GITHUB_TOKEN scopes. Jobs override as needed;
# this default protects any future job added without its own `permissions:`
# block from silently inheriting the repo's (often write-capable) defaults.
# Auth to the DAC API uses a static secret (no OIDC), so `id-token: write`
# is intentionally not granted.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      consoles: ${{ steps.consoles.outputs.consoles }}
    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            -r requirements.txt

      - name: Validate repository and list consoles
        id: consoles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          consoles=$(python detection-as-code.py validate)
          echo "consoles=$consoles" >> "$GITHUB_OUTPUT"

  diff:
    if: github.event_name == 'pull_request'
    needs: plan
    name: diff (${{ matrix.console.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        console: ${{ fromJSON(needs.plan.outputs.consoles) }}
    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            -r requirements.txt

      - name: Diff detections
        env:
          API_TOKEN: ${{ secrets[matrix.console.tokenSecret] }}
          DEPLOYMENTS_FILE: ${{ matrix.console.deploymentsFile }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python detection-as-code.py diff

  apply:
    if: github.event_name == 'push'
    needs: plan
    name: apply (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.consoles) }}
    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            -r requirements.txt

      - name: Apply detections
        env:
          API_TOKEN: ${{ secrets[matrix.target.tokenSecret] }}
          DEPLOYMENTS_FILE: ${{ matrix.target.deploymentsFile }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python detection-as-code.py apply
